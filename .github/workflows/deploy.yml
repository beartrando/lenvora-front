name: Build & Publish Mobile App

on:
  push:
    branches:
      - dev
      - uat
      - prod

jobs:
  determine-version:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version from the latest git tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git fetch origin 'refs/tags/*:refs/tags/*'

          TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)

          if [ -z "$TAG" ]; then
            TAG="v0.0.0"
          fi

          # Remove leading "v" for calculations
          TAG=${TAG#v}

          echo "TAG=$TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Bump version
        id: bump_version
        run: |
          IFS='.' read -r -a VERSION_PARTS <<< "$TAG"

          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"

          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          while git tag -l "v$MAJOR.$MINOR.$PATCH" | grep -q .; do
            if [ "$GITHUB_REF_NAME" = "dev" ]; then
              PATCH=$((PATCH + 1))
            fi

            if [ "$GITHUB_REF_NAME" = "uat" ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            fi

            if [ "$GITHUB_REF_NAME" = "prod" ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            fi
          done

          VERSION="$MAJOR.$MINOR.$PATCH"

          echo "VERSION=$VERSION" >> $GITHUB_ENV

          echo "Generated version: v$VERSION"

      - name: Create and push release tag
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git

          git tag -a "v$VERSION" -m "Release v$VERSION"

          git push origin "v$VERSION"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.9.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build appbundle
        run: |
          flutter build appbundle \
            --release \
            --build-name=$VERSION \
            --build-number=$GITHUB_RUN_NUMBER

      - name: Upload to Google Play (internal)
        if: github.ref_name != 'prod'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: org.beartrando.tictactoe
          releaseFile: build/app/outputs/bundle/release/app-release.aab
          track: internal
          whatsNewDirectory: ./release-notes

      - name: Upload to Google Play (production)
        if: github.ref_name == 'prod'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: org.beartrando.tictactoe
          releaseFile: build/app/outputs/bundle/release/app-release.aab
          track: production
          whatsNewDirectory: ./release-notes


